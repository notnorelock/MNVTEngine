# Engine CI: builds and tests every push and pull request, and publishes a GitHub release when run by hand.
# One workflow, so github.run_number is one counter for every build number (docs/architecture/versioning.md).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release of this build
        type: boolean
        default: true
      channel:
        description: Release channel (anything but release is marked as a prerelease)
        type: choice
        options: [release, beta, preview, nightly]
        default: release

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PATCH is the commit count: a shallow clone cannot count it

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        shell: cmd
        run: scripts\build.cmd Release
        # Only here: tests make their own builds and must not inherit the release identity.
        env:
          MNVT_BUILD_NUMBER: ${{ github.run_number }}
          MNVT_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'development' }}

      # Game script projects reference engine projects and build them in Debug. Built here once, so the test
      # processes that compile scripts in parallel find them up to date instead of compiling the same obj/Debug.
      - name: Engine for script builds
        run: dotnet build src/Engine/MNVTEngine.GameHost/MNVTEngine.GameHost.csproj -c Debug

      - name: Test
        run: dotnet test --solution MNVTEngine.sln -c Release --no-build

      - name: Engine version
        id: version
        shell: pwsh
        run: |
          $info = Get-Content src/Editor/MNVTEngine.Editor/bin/Release/net11.0/MNVTEngine.version.json -Raw | ConvertFrom-Json
          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          Write-Host "MNVTEngine $($info.informationalVersion), build $($info.buildId)"

      # The release is an installed engine without sources (scripts/Package-Release.ps1): the editor, mnvt, the engine
      # as NuGet packages with the game host's startup project, and the crash handler and browser host prebuilt.
      - name: Package
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: pwsh
        run: |
          ./scripts/Package-Release.ps1 -Output "$env:RUNNER_TEMP/release" -Zip
          $zip = Get-ChildItem "$env:RUNNER_TEMP/release" -Filter *.zip | Select-Object -First 1
          "ZIP=$($zip.FullName)" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        if: env.ZIP != ''
        with:
          name: engine
          path: ${{ env.ZIP }}

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ inputs.channel != 'release' && '--prerelease' || '' }}
        run: >
          gh release create "v$VERSION" *.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "MNVTEngine $VERSION" --generate-notes $PRERELEASE
