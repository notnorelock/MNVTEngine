<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HUD</title>
  <style>
    html, body { margin: 0; background: transparent; font: bold 34px "Segoe UI", sans-serif; color: white; }
    .hud { margin: 14px; padding: 14px 20px; border-radius: 18px; background: rgba(79, 179, 255, 0.35); border: 3px solid rgba(255, 255, 255, 0.8); }
    small { display: block; font-size: 20px; font-weight: normal; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="hud"><span id="time"></span><small>transparent overlay page</small></div>
  <script>setInterval(() => { document.getElementById('time').textContent = new Date().toLocaleTimeString(); }, 200);</script>
</body>
</html>
